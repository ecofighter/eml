[package]
name = "eml_interp"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

[dependencies]
eml_core_ir.workspace = true
eml_runtime.workspace = true

[dev-dependencies]
eml_test_support = { workspace = true, features = ["run"] }

[[test]]
name = "integration"
path = "tests/main.rs"
