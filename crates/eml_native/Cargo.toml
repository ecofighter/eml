[package]
name = "eml_native"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

# workspaceのcrateではeml_extern、eml_cabi、eml_lir、eml_nrt、eml_rt (eml_rtはレイアウトの定数だけで、名指すのはmem.rsだけ) に
# 依存し、eml_vmには依存しない (docs/implementation/architecture.md の「crate の依存関係」)
[dependencies]
eml_extern.workspace = true
eml_cabi.workspace = true
eml_lir.workspace = true
eml_nrt.workspace = true
eml_rt.workspace = true
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-jit.workspace = true
cranelift-module.workspace = true
cranelift-native.workspace = true
libloading.workspace = true

[dev-dependencies]
eml_test_support = { workspace = true, features = ["run"] }
insta.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
