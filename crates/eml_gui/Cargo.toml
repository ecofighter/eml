[package]
name = "eml_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストはなく、単体テストは`src/`にある (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

# nativeはネイティブのbackendを足す。今はmacOSのAppKitだけで、ほかのOSでは`Backend::Native`がNotAvailableを返す
[features]
native = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-core-foundation"]

[dependencies]
taffy.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }
