[package]
name = "eml_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストはなく、単体テストは`src/`にある (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

# nativeはネイティブのbackendを足す。macOSではAppKit、LinuxではQt 6、WindowsではWinUI 3で、ほかのOSでは`Backend::Native`がNotAvailableを返す。
# LinuxではビルドにQt 6の開発用のファイルが要る (docs/implementation/architecture.mdの「`eml_gui`の内部」)
[features]
native = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:cxx",
    "dep:cxx-build",
    "dep:qt-build-utils",
    "dep:winui3",
    "dep:windows",
    "dep:windows-core",
    "dep:windows-reference",
    "dep:windows-time",
]

[dependencies]
taffy.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cxx = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winui3 = { workspace = true, optional = true }
windows = { workspace = true, optional = true }
windows-core = { workspace = true, optional = true }
windows-reference = { workspace = true, optional = true }
windows-time = { workspace = true, optional = true }

# build.rsはtargetがLinuxのときだけこれらを使う。build-dependenciesのtargetの条件はhostで決まるので、OSで分けない
[build-dependencies]
cxx-build = { workspace = true, optional = true }
qt-build-utils = { workspace = true, optional = true }
