[package]
name = "eml_vm"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

[dependencies]
eml_extern.workspace = true
eml_lir.workspace = true
eml_io.workspace = true
eml_rt.workspace = true
rustc-hash.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
eml_test_support = { workspace = true, features = ["run"] }
insta.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
