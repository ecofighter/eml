[package]
name = "eml_vm"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

# guiを外すとStd.Guiを開けず、NotAvailableを投げる。gui-nativeはネイティブのGUIのbackendを足し、ないとnativeの
# backendを選んだ`Gui.run`がNotAvailableを投げる
[features]
gui = ["dep:eml_gui"]
gui-native = ["gui", "eml_gui/native"]

[dependencies]
eml_cabi.workspace = true
eml_extern.workspace = true
eml_gui = { workspace = true, optional = true }
eml_lir.workspace = true
eml_io.workspace = true
eml_rows.workspace = true
eml_rt.workspace = true
eml_sched.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
eml_sched = { workspace = true, features = ["testing"] }
eml_test_support = { workspace = true, features = ["run"] }
insta.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
