[package]
name = "eml_vm"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

# tlsを外すとStd.Tlsの腕はNotAvailableを投げる。guiを外すとStd.Guiを開けず、NotAvailableを投げる。gui-nativeは
# ネイティブのGUIのbackendを足し、ないとnativeのbackendを選んだ`Gui.run`がNotAvailableを投げる
[features]
tls = ["dep:eml_tls", "eml_io/tls"]
gui = ["dep:eml_gui"]
gui-native = ["gui", "eml_gui/native"]

[dependencies]
eml_cabi.workspace = true
eml_extern.workspace = true
eml_gui = { workspace = true, optional = true }
eml_lir.workspace = true
eml_io.workspace = true
eml_rt.workspace = true
eml_tls = { workspace = true, optional = true }
rustc-hash.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
eml_test_support = { workspace = true, features = ["run"] }
insta.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
