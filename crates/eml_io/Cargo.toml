[package]
name = "eml_io"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

[lib]
doctest = false

# tls を使うのはテスト用 driver の終端器と名前 tls.localhost だけで、実機の driver は使わない
# (docs/implementation/architecture.md の「crate の依存関係」)
[features]
tls = ["dep:eml_tls"]

[dependencies]
eml_rt.workspace = true
eml_tls = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Threading"] }

[[test]]
name = "integration"
path = "tests/main.rs"
