[package]
name = "eml_steps"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.mdの「crate の中の置き方」)
autotests = false

[lib]
doctest = false

# vstdのほかには依存しない (docs/implementation/architecture.mdの「`eml_steps`の内部」)
[dependencies]
vstd = "=0.0.0-2026-10-25-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
