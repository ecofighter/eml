[package]
name = "eml_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

# 単体テストがないので、空のテストのバイナリを作らない。単体テストを足すときは `test = false` を外す
[lib]
test = false
doctest = false

[[bin]]
name = "eml"
path = "src/main.rs"
required-features = ["run"]

# `eml_test_support`はこのcrateでパイプラインを組むので、段階ごとにfeatureを分ける。各crateのテストは自分より
# 下流のcrateを組み立てずに済む (docs/implementation/testing.md)。
# tlsはrunに足すStd.Tlsで、外すとStd.Tlsの腕がNotAvailableを投げる。`dep:eml_tls`はsrc/では使わず、
# 本物のソケットの上の結合テスト (tests/tls.rs) がサーバーを立てるためにある。dev-dependencyにしない理由は
# docs/implementation/testing.mdの「OS ごとのテスト」にある。guiはrunに足すStd.Guiで、外すとStd.Guiを
# 開けず、NotAvailableを投げる。gui-nativeはネイティブのGUIのbackendを足す。既定に入れないので、既定のビルドは
# toolkitの開発用のファイルを要らない (docs/implementation/architecture.mdの「crate の依存関係」)。
[features]
default = ["run", "tls", "gui"]
types = ["dep:eml_types"]
core = ["types", "dep:eml_core_ir", "dep:eml_lir"]
run = ["core", "dep:eml_vm", "dep:eml_clink", "dep:eml_io", "dep:eml_native", "dep:eml_rows", "dep:eml_sched", "dep:libc", "dep:rustyline", "dep:windows-sys"]
tls = ["run", "eml_rows/tls", "eml_io/tls", "dep:eml_tls"]
gui = ["run", "eml_rows/gui"]
gui-native = ["gui", "eml_rows/gui-native"]

[dependencies]
clap.workspace = true
eml_clink = { workspace = true, optional = true }
eml_core_ir = { workspace = true, optional = true }
eml_diagnostics.workspace = true
eml_hir.workspace = true
eml_io = { workspace = true, optional = true }
eml_lir = { workspace = true, optional = true }
eml_native = { workspace = true, optional = true }
eml_rows = { workspace = true, optional = true }
eml_sched = { workspace = true, optional = true }
eml_syntax.workspace = true
eml_tls = { workspace = true, optional = true }
eml_types = { workspace = true, optional = true }
eml_vm = { workspace = true, optional = true }
rustyline = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Pipes、Security、Storage_FileSystem は、tests/cli.rs が名前付きパイプを作るためだけにある
windows-sys = { workspace = true, optional = true, features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_SystemInformation"] }

[dev-dependencies]
eml_extern.workspace = true
eml_native.workspace = true
eml_rt.workspace = true
eml_test_support = { workspace = true, features = ["run"] }
insta.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
required-features = ["run"]
