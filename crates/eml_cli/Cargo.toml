[package]
name = "eml_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

# 単体テストがないので、空のテストのバイナリを作らない。単体テストを足すときは `test = false` を外す
[lib]
test = false
doctest = false

[[bin]]
name = "eml"
path = "src/main.rs"
required-features = ["run"]

# `eml_test_support` はこの crate でパイプラインを組むので、段階ごとに feature を分ける。各 crate のテストは自分より
# 下流の crate を組み立てずに済む (docs/implementation/testing.md)。
[features]
default = ["run"]
types = ["dep:eml_types"]
core = ["types", "dep:eml_core_ir", "dep:eml_lir"]
run = ["core", "dep:eml_vm", "dep:libc", "dep:rustyline", "dep:windows-sys"]

[dependencies]
clap.workspace = true
eml_core_ir = { workspace = true, optional = true }
eml_diagnostics.workspace = true
eml_hir.workspace = true
eml_lir = { workspace = true, optional = true }
eml_syntax.workspace = true
eml_types = { workspace = true, optional = true }
eml_vm = { workspace = true, optional = true }
rustyline = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
eml_rt.workspace = true
eml_test_support = { workspace = true, features = ["run"] }
insta.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
required-features = ["run"]
