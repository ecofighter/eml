[package]
name = "eml_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# 結合テストは1つのバイナリにまとめる (docs/implementation/testing.md の「crate の中の置き方」)
autotests = false

# 単体テストがないので、空のテストのバイナリを作らない。単体テストを足すときは `test = false` を外す
[lib]
test = false
doctest = false

[[bin]]
name = "eml"
path = "src/main.rs"
test = false

[dependencies]
clap.workspace = true
eml_core_ir.workspace = true
eml_diagnostics.workspace = true
eml_hir.workspace = true
eml_interp.workspace = true
eml_runtime.workspace = true
eml_syntax.workspace = true
eml_types.workspace = true

[dev-dependencies]
insta.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
