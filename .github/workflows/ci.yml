# 流すものと理由は docs/implementation/testing.md の「CI」にある
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ組で待つ実行は新しい実行に置き換わるので、main ではコミットごとに組を分け、どのコミットにも結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup は rust-toolchain.toml のバージョンを入れる。runner の stable のままでないことをバージョンの比べで確かめる
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc -V
          test "$(rustc -V | cut -d' ' -f2)" = "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
      # Windows の target は msvc だけである
      - name: Check the Windows host
        if: runner.os == 'Windows'
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: cargo nextest run
        id: test
        run: cargo nextest run --failure-output immediate-final
      # ワークスペースの実行ではeml_cliの既定がtlsとguiを有効にするので、それらを外した処理系の振る舞いは
      # eml_io と eml_vm だけを選んで流す (docs/implementation/testing.md の「feature の組み合わせの確認」)
      - name: cargo nextest run without tls and gui
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: cargo nextest run -p eml_io -p eml_vm --failure-output immediate-final -E 'test(tls_off::) | test(gui_off::)'
      # 時間の検査は runner の速さをそろえるため x86_64 の Linux だけで流す。ビルドは前の手順のものを使う
      - name: cargo nextest run --profile timing -j 1
        if: ${{ matrix.os == 'ubuntu-24.04' && !cancelled() && steps.test.outcome != 'skipped' }}
        run: cargo nextest run --profile timing -j 1 --failure-output immediate-final
      # テストが落ちても lint の結果は見たいので、前の手順が済んでいれば流す
      - name: cargo clippy --all-targets
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy of the non-default features
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          cargo clippy -p eml_cli --no-default-features -- -D warnings
          cargo clippy -p eml_cli --no-default-features --features types -- -D warnings
          cargo clippy -p eml_cli --no-default-features --features core -- -D warnings
          cargo clippy -p eml_cli --no-default-features --features run -- -D warnings
          cargo clippy -p eml_cli --no-default-features --features run,gui -- -D warnings
          cargo clippy -p eml_io -p eml_vm -p eml_nrt --all-targets -- -D warnings
          cargo clippy -p eml_test_support --no-default-features -- -D warnings
          cargo clippy -p eml_test_support --no-default-features --features hir -- -D warnings
          cargo clippy -p eml_test_support --no-default-features --features types -- -D warnings
          cargo clippy -p eml_test_support --no-default-features --features core -- -D warnings
      # ワークスペースの実行で eml_io と eml_vm の tls が有効になり、eml_vm だけを選ぶ Miri と ASan には eml_tls が入らず、
      # .#cross の clippy が eml_tls なしで組めることを、feature の解決で確かめる (docs/implementation/testing.md の「feature の組み合わせの確認」)
      - name: feature resolution of tls
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          test "$(cargo tree --workspace -e features -i eml_io | grep -c 'eml_io feature "tls"')" -ge 1
          test "$(cargo tree --workspace -e features -i eml_vm | grep -c 'eml_vm feature "tls"')" -ge 1
          test "$(cargo tree -p eml_vm -p eml_io -e normal,dev,build --target all | grep -c -E 'eml_tls|aws-lc|ring v')" -eq 0
          test "$(cargo tree --workspace --exclude eml_tls --no-default-features --features eml_cli/run,eml_test_support/run -e normal,dev,build --target all | grep -c -E 'eml_tls|aws-lc|ring v')" -eq 0
      # VMはCranelift、eml_native、eml_nrtのどれにも依存せず、eml_nrtはCranelift、eml_lir、eml_core_ir、eml_vm、eml_nativeに
      # 依存せず、eml_nativeはeml_vmに依存せず、eml_lirはeml_rtに依存せず、externの表はunsafeを持たない
      # (docs/implementation/architecture.md の「crate の依存関係」)
      - name: dependency edges of eml_native
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          test "$(cargo tree -p eml_vm -e normal --target all | grep -c -E 'cranelift|eml_native|eml_nrt')" -eq 0
          test "$(cargo tree -p eml_nrt -e normal --target all | grep -c -E 'cranelift|eml_lir|eml_core_ir|eml_vm|eml_native')" -eq 0
          test "$(cargo tree -p eml_native -e normal --target all | grep -c -E 'eml_vm')" -eq 0
          test "$(cargo tree -p eml_lir -e normal --target all | grep -c -E 'eml_rt')" -eq 0
          test -z "$(grep -rn unsafe crates/eml_extern/src)"
      # eml_guiはワークスペースのどのcrateにも依存せず、既定の依存の木にnativeのtoolkitのcrateは入らない。gui-nativeの木には
      # 3つのtoolkitのcrateがどれも入る。既定の木では、生成したWinUIのbindingだけが使うwindows-collections、windows-reference、
      # windows-timeも見る。gui-nativeの木でのWinUIの印は、windows-collectionsとする
      # (docs/implementation/architecture.mdの「crate の依存関係」)
      - name: dependency edges of eml_gui
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          test "$(cargo tree -p eml_gui -e normal --target all --prefix none | grep -v '^eml_gui ' | grep -c '^eml_')" -eq 0
          test "$(cargo tree -p eml_cli -e normal,build --target all | grep -c -E 'cxx v|objc2 v|windows-collections v|windows-reference v|windows-time v|qt-build-utils v')" -eq 0
          cargo tree -p eml_cli --features gui-native -e normal,build --target all > "$RUNNER_TEMP/gui-native-tree.txt"
          grep -q 'cxx v' "$RUNNER_TEMP/gui-native-tree.txt"
          grep -q 'objc2 v' "$RUNNER_TEMP/gui-native-tree.txt"
          grep -q 'windows-collections v' "$RUNNER_TEMP/gui-native-tree.txt"
          grep -q 'qt-build-utils v' "$RUNNER_TEMP/gui-native-tree.txt"

  # nativeのGUIのbackendを組み、stubのテストを流す。画面を開くテストはない (docs/implementation/testing.mdの「CI」)
  gui-native:
    name: gui-native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        if: runner.os != 'Linux'
        run: rustup toolchain install
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: runner.os == 'Linux'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.os != 'Linux'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: runner.os != 'Linux'
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: cargo clippy --features gui-native
        id: clippy
        run: ${{ runner.os == 'Linux' && 'nix develop -c' || '' }} cargo clippy --all-targets --features eml_cli/gui-native -- -D warnings
      - name: cargo nextest run --features gui-native
        if: ${{ !cancelled() && steps.clippy.outcome != 'skipped' }}
        run: ${{ runner.os == 'Linux' && 'nix develop -c' || '' }} cargo nextest run --features eml_cli/gui-native --failure-output immediate-final
      # bootstrapのテストがskipしたかをログに出す。--no-captureはテストを1つずつ流すので、このテストにだけ付ける
      - name: WinUI bootstrap test with its output
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.clippy.outcome != 'skipped' }}
        run: cargo nextest run --features eml_cli/gui-native --no-capture -E 'test(=winui::tests::bootstrap_names_the_download_page_when_the_runtime_is_missing)'
      # Qtは動的にリンクし、配るものにQtとWindows App SDKのファイルを含めない (docs/implementation/distribution.md)
      - name: nix build links Qt dynamically
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.clippy.outcome != 'skipped' }}
        run: |
          nix build
          readelf -d result/bin/.eml-wrapped | grep -q 'libQt6Widgets.so.6'
          test "$(find -L result \( -name 'libQt6*' -o -name '*.dll' -o -name '*.msix' \) | wc -l)" -eq 0

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check

  verus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo verus verify -p eml_rt
        id: verify
        run: nix develop -c cargo verus verify -p eml_rt
      - name: verusfmt --check
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' }}
        run: |
          mapfile -t files < <(git ls-files 'crates/eml_rt/src/*.rs')
          nix develop -c verusfmt --verus-only --check "${files[@]}"

  # eml と一緒に配る THIRD-PARTY-LICENSES.md が、Cargo.lock と about.toml から生成した結果と同じことを確かめる。
  # cargo-about のバージョンを flake.lock で固め、出力を変えないよう、ふだんの devShell を通す (docs/implementation/testing.md の「CI」)
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: THIRD-PARTY-LICENSES.md is up to date
        run: nix develop -c nix/third-party-licenses.sh --check

  miri:
    name: miri (${{ matrix.borrows }} borrows)
    strategy:
      fail-fast: false
      matrix:
        include:
          - borrows: stacked
            miriflags: -Zmiri-strict-provenance
          - borrows: tree
            miriflags: -Zmiri-strict-provenance -Zmiri-tree-borrows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIRIFLAGS: ${{ matrix.miriflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "cargo miri test -p eml_rt trusted::"
        id: rt
        run: |
          nix develop .#miri -c cargo miri test -p eml_rt trusted::
      - name: "cargo miri test -p eml_vm --test integration miri::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo miri test -p eml_vm --test integration miri::
      - name: "cargo miri test -p eml_vm --lib -- cells::a_read cells::a_write counters::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo miri test -p eml_vm --lib -- cells::a_read cells::a_write counters::
      - name: "cargo miri test -p eml_io --lib -- driver::tests::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo miri test -p eml_io --lib -- driver::tests::
      - name: "cargo miri test -p eml_nrt --lib -- entries::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo miri test -p eml_nrt --lib -- entries::

  # OSを呼ぶunsafe (eml_ioのsys/) と、VMが本物のdriverとCの関数に貸す記憶、eml_nativeの橋渡し、eml_nrtのエントリのstubを
  # AddressSanitizerの下で流す。RustのASanはWindowsのmsvcを対象にしないので、3つの対象で流す
  # (docs/implementation/testing.md の「AddressSanitizer」)
  asan:
    name: asan (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo test -p eml_io
        id: io
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target ${{ matrix.target }} -p eml_io
      - name: "cargo test -p eml_vm --test integration -- api:: signal:: io:: workers:: ffi:: ffi_abandon:: seat:: pinned::"
        if: ${{ !cancelled() && steps.io.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target ${{ matrix.target }} -p eml_vm --test integration -- api:: signal:: io:: workers:: ffi:: ffi_abandon:: seat:: pinned::
      # longjmpはASanのスタックの印を残すので、致命的な誤りの道のテスト (fatal::) は飛ばす (docs/implementation/testing.md の
      # 「`eml_native` の検証」と「`eml_nrt`の検証」)
      - name: "cargo test -p eml_native -- --skip fatal::"
        if: ${{ !cancelled() && steps.io.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target ${{ matrix.target }} -p eml_native -- --skip fatal::
      - name: "cargo test -p eml_nrt -- --skip fatal::"
        if: ${{ !cancelled() && steps.io.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target ${{ matrix.target }} -p eml_nrt -- --skip fatal::

  # worker のスレッドの間で共有する記憶 (eml_rt の remote 解放、VM の起こしの語、run の表と登録表、mail、操作の転送、Counter の atomic、channel、CCall) と、
  # driver のプールのスレッドが書く貸した記憶を ThreadSanitizer の下で流す。
  # 合否は終了コードで決める (docs/implementation/testing.md の「ThreadSanitizer」)
  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Zsanitizer=thread
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "cargo test -p eml_rt trusted::"
        id: rt
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p eml_rt trusted::
      - name: "cargo test -p eml_vm --test integration -- workers:: signal:: io:: chan:: ffi:: ffi_abandon:: seat:: pinned::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p eml_vm --test integration -- workers:: signal:: io:: chan:: ffi:: ffi_abandon:: seat:: pinned::
      - name: "cargo test -p eml_vm --lib counters::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p eml_vm --lib counters::
      - name: "cargo test -p eml_io --lib -- driver::tests::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p eml_io --lib -- driver::tests::
