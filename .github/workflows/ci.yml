# 流すものと理由は docs/implementation/testing.md の「CI」にある
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ組で待つ実行は新しい実行に置き換わるので、main ではコミットごとに組を分け、どのコミットにも結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup は rust-toolchain.toml のバージョンを入れる。runner の stable のままでないことをバージョンの比べで確かめる
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc -V
          test "$(rustc -V | cut -d' ' -f2)" = "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
      # Windows の target は msvc だけである
      - name: Check the Windows host
        if: runner.os == 'Windows'
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: cargo nextest run
        id: test
        run: cargo nextest run --failure-output immediate-final
      # 時間の検査は runner の速さをそろえるため x86_64 の Linux だけで流す。ビルドは前の手順のものを使う
      - name: cargo nextest run --profile timing -j 1
        if: ${{ matrix.os == 'ubuntu-24.04' && !cancelled() && steps.test.outcome != 'skipped' }}
        run: cargo nextest run --profile timing -j 1 --failure-output immediate-final
      # テストが落ちても lint の結果は見たいので、前の手順が済んでいれば流す
      - name: cargo clippy --all-targets
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy of the non-default features
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          cargo clippy -p eml_cli --no-default-features -- -D warnings
          cargo clippy -p eml_cli --no-default-features --features types -- -D warnings
          cargo clippy -p eml_cli --no-default-features --features core -- -D warnings
          cargo clippy -p eml_test_support --no-default-features -- -D warnings
          cargo clippy -p eml_test_support --no-default-features --features hir -- -D warnings
          cargo clippy -p eml_test_support --no-default-features --features types -- -D warnings
          cargo clippy -p eml_test_support --no-default-features --features core -- -D warnings

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check

  verus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo verus verify -p eml_rt
        id: verify
        run: nix develop -c cargo verus verify -p eml_rt
      - name: verusfmt --check
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' }}
        run: |
          mapfile -t files < <(git ls-files 'crates/eml_rt/src/*.rs')
          nix develop -c verusfmt --verus-only --check "${files[@]}"

  miri:
    name: miri (${{ matrix.borrows }} borrows)
    strategy:
      fail-fast: false
      matrix:
        include:
          - borrows: stacked
            miriflags: -Zmiri-strict-provenance
          - borrows: tree
            miriflags: -Zmiri-strict-provenance -Zmiri-tree-borrows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIRIFLAGS: ${{ matrix.miriflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "cargo miri test -p eml_rt trusted::"
        id: rt
        run: |
          nix develop .#miri -c cargo miri test -p eml_rt trusted::
      - name: "cargo miri test -p eml_vm --test integration miri::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo miri test -p eml_vm --test integration miri::
      - name: "cargo miri test -p eml_vm --lib -- cells::a_read cells::a_write"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo miri test -p eml_vm --lib -- cells::a_read cells::a_write
      - name: "cargo miri test -p eml_io --lib -- driver::tests::"
        if: ${{ !cancelled() && steps.rt.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo miri test -p eml_io --lib -- driver::tests::

  # OS を呼ぶ unsafe (eml_io の sys/) と、VM が本物の driver に貸す記憶を AddressSanitizer の下で流す。
  # Rust の ASan は Windows の msvc を対象にしないので、3つの対象で流す (docs/implementation/testing.md の「AddressSanitizer」)
  asan:
    name: asan (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo test -p eml_io
        id: io
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target ${{ matrix.target }} -p eml_io
      - name: "cargo test -p eml_vm --test integration -- api:: signal::"
        if: ${{ !cancelled() && steps.io.outcome != 'skipped' }}
        run: |
          nix develop .#miri -c cargo test -Zbuild-std --target ${{ matrix.target }} -p eml_vm --test integration -- api:: signal::
