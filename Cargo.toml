[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
eml_diagnostics = { path = "crates/eml_diagnostics" }
eml_syntax = { path = "crates/eml_syntax" }
eml_extern = { path = "crates/eml_extern" }
eml_hir = { path = "crates/eml_hir" }
eml_types = { path = "crates/eml_types" }
eml_core_ir = { path = "crates/eml_core_ir" }
eml_lir = { path = "crates/eml_lir" }
eml_rt = { path = "crates/eml_rt" }
eml_io = { path = "crates/eml_io" }
eml_vm = { path = "crates/eml_vm" }
eml_cli = { path = "crates/eml_cli", default-features = false }
eml_test_support = { path = "crates/eml_test_support", default-features = false }
ariadne = "0.6"
clap = { version = "4.6", features = ["derive"] }
compio-buf = "=0.8.3"
compio-driver = { version = "=0.12.5", default-features = false, features = ["polling", "sync"] }
insta = "1.49"
la-arena = "0.3"
libc = "0.2"
logos = "0.16"
rustyline = { version = "19.0.0", default-features = false, features = ["buffer-redux"] }
rowan = "0.17"
rustc-hash = "2.1"
text-size = "1.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

# テストの時間の多くはフロントエンドにあり、一部の crate だけを最適化しても縮まない。debug assertions は既定のまま有効にする
# (docs/implementation/testing.md の「よく使うコマンド」)
[profile.dev]
opt-level = 1
